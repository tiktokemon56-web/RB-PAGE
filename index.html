<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XOX GAME</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: #080b0a;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.game {
  width: 92%;
  max-width: 380px;
  text-align: center;
  padding: 25px 18px;
  background: #111714;
  border: 1px solid #263a2d;
  border-radius: 22px;
  box-shadow: 0 0 30px #00ff6620;
}
h1 {
  color: #00ff77;
  font-size: 35px;
  letter-spacing: 5px;
  margin-bottom: 8px;
}
.subtitle {
  color: #aaa;
  margin-bottom: 24px;
}
.score {
  display: flex;
  justify-content: space-around;
  margin-bottom: 22px;
  background: #080b09;
  padding: 14px 5px;
  border-radius: 12px;
}
.score div { font-size: 14px; color: #bbb; }
.score strong {
  display: block;
  color: #00ff77;
  font-size: 24px;
  margin-top: 7px;
}
#status {
  color: #fff;
  margin-bottom: 18px;
  font-size: 17px;
  min-height: 20px;
}
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}
.cell {
  aspect-ratio: 1;
  background: #202a23;
  border: 1px solid #35483a;
  border-radius: 13px;
  color: #00ff77;
  font-size: 46px;
  font-weight: bold;
  cursor: pointer;
}
.cell:disabled { cursor: default; }
.cell.win {
  background: #07532d;
  border-color: #00ff77;
}
button:focus-visible {
  outline: 2px solid white;
}
.actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}
.actions button {
  flex: 1;
  padding: 13px 5px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.restart {
  background: #00ff77;
  color: #061008;
}
.reset {
  background: #29332c;
  color: white;
}
footer {
  color: #777;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="game">
  <h1>XOX GAME</h1>
  <p class="subtitle">TIC TAC TOE</p>

  <div class="score">
    <div>PLAYER X<strong id="scoreX">0</strong></div>
    <div>DRAW<strong id="scoreD">0</strong></div>
    <div>PLAYER O<strong id="scoreO">0</strong></div>
  </div>

  <p id="status">Player X-এর চাল</p>

  <div class="board" id="board">
    <button class="cell" aria-label="ঘর ১"></button>
    <button class="cell" aria-label="ঘর ২"></button>
    <button class="cell" aria-label="ঘর ৩"></button>
    <button class="cell" aria-label="ঘর ৪"></button>
    <button class="cell" aria-label="ঘর ৫"></button>
    <button class="cell" aria-label="ঘর ৬"></button>
    <button class="cell" aria-label="ঘর ৭"></button>
    <button class="cell" aria-label="ঘর ৮"></button>
    <button class="cell" aria-label="ঘর ৯"></button>
  </div>

  <div class="actions">
    <button class="restart" id="restart">↻ RESTART</button>
    <button class="reset" id="reset">RESET SCORE</button>
  </div>

  <footer>MADE WITH ♥ · XOX GAME</footer>
</div>

<script>
const cells = [...document.querySelectorAll(".cell")];
const statusText = document.getElementById("status");
let board = Array(9).fill("");
let current = "X";
let gameOver = false;
let scores = { X: 0, O: 0, D: 0 };

const wins = [
  [0,1,2], [3,4,5], [6,7,8],
  [0,3,6], [1,4,7], [2,5,8],
  [0,4,8], [2,4,6]
];

function play(index) {
  if (gameOver || board[index]) return;

  board[index] = current;
  cells[index].textContent = current;
  cells[index].disabled = true;

  const winningLine = wins.find(line =>
    line.every(i => board[i] === current)
  );

  if (winningLine) {
    gameOver = true;
    winningLine.forEach(i => cells[i].classList.add("win"));
    scores[current]++;
    updateScores();
    statusText.textContent = "🎉 Player " + current + " Wins!";
    cells.forEach(cell => cell.disabled = true);
    return;
  }

  if (board.every(Boolean)) {
    gameOver = true;
    scores.D++;
    updateScores();
    statusText.textContent = "🤝 ম্যাচ ড্র হয়েছে!";
    return;
  }

  current = current === "X" ? "O" : "X";
  statusText.textContent = "Player " + current + "-এর চাল";
}

function updateScores() {
  document.getElementById("scoreX").textContent = scores.X;
  document.getElementById("scoreO").textContent = scores.O;
  document.getElementById("scoreD").textContent = scores.D;
}

function restartGame() {
  board = Array(9).fill("");
  current = "X";
  gameOver = false;
  cells.forEach(cell => {
    cell.textContent = "";
    cell.disabled = false;
    cell.classList.remove("win");
  });
  statusText.textContent = "Player X-এর চাল";
}

cells.forEach((cell, index) => {
  cell.addEventListener("click", () => play(index));
});

document.getElementById("restart")
  .addEventListener("click", restartGame);

document.getElementById("reset").addEventListener("click", () => {
  scores = { X: 0, O: 0, D: 0 };
  updateScores();
  restartGame();
});
</script>

</body>
     </html>
